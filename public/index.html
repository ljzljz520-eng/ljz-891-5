<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>入场码查询 · 2026 国际智能科技博览会</title>
  <meta name="description" content="输入手机号与入场码，查询展会入场信息与核验状态" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="brand-mark">展</div>
        <div class="brand-text">
          <strong>2026 国际智能科技博览会</strong>
          <span>EXPO&nbsp;PASS&nbsp;SERVICE</span>
        </div>
      </div>
      <div class="topbar-side">
        <a href="/admin" style="color:var(--text-2);">管理登录</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="kicker"><span class="dot"></span>SECURE CHECK-IN SYSTEM</div>
      <h1>展会入场码查询</h1>
      <p>输入您登记的手机号与入场码，即可查看入场信息与核验状态</p>
    </section>

    <section class="card card-glow query-wrap">
      <form id="queryForm" autocomplete="off">
        <div class="field">
          <label for="phone">手机号码</label>
          <div class="input-wrap">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="2" width="12" height="20" rx="2.5"/>
              <line x1="10.5" y1="18" x2="13.5" y2="18"/>
            </svg>
            <input class="has-icon" type="text" id="phone" name="phone"
                   inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" />
          </div>
        </div>
        <div class="field">
          <label for="code">入场码</label>
          <div class="input-wrap">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/>
              <path d="M13 6v2M13 11v2M13 16v2" stroke-dasharray="0.1 3"/>
            </svg>
            <input class="has-icon" type="text" id="code" name="code"
                   maxlength="32" placeholder="请输入入场码，如 EXPO2026A0001" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="btnText">立即查询</span>
        </button>
      </form>

      <div id="alertBox"></div>
      <div id="resultBox"></div>

      <div class="notice-bar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        信息仅用于入场核验，系统将记录查询行为
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      2026 国际智能科技博览会 · 入场服务中心 &nbsp;|&nbsp;
      会期 2026.10.15 – 10.18 · 上海国际会展中心 &nbsp;|&nbsp;
      <a href="/admin">工作人员入口</a>
    </div>
  </footer>

  <script src="/js/query.js"></script>
</body>
</html>
