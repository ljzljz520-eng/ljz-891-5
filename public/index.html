<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入场码查询 · 展会通</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg-fx"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">展</div>
      <div class="name">展会通<small>EXPO PASS</small></div>
    </div>
    <div class="right"><a href="/admin.html">管理后台 →</a></div>
  </header>

  <main class="query-wrap">
    <div class="card query-card">
      <h1>入场码查询</h1>
      <p class="sub">输入观展登记的手机号与入场码，查询您的参展信息</p>

      <form id="queryForm">
        <div class="field">
          <label for="phone">手机号</label>
          <input id="phone" type="tel" maxlength="11" placeholder="请输入 11 位手机号" autocomplete="tel">
        </div>
        <div class="field">
          <label for="code">入场码</label>
          <input id="code" type="text" maxlength="32" placeholder="例如 EXPO-A1001" autocomplete="off">
        </div>
        <button class="btn" id="queryBtn" type="submit">立即查询</button>
        <div class="msg err" id="errorMsg"></div>
      </form>

      <div class="result" id="result">
        <div class="result-head">
          <span class="pname" id="rName"></span>
          <span class="badge" id="rStatus"></span>
        </div>
        <dl class="kv">
          <dt>票种</dt><dd id="rType"></dd>
          <dt>入场日期</dt><dd id="rDate"></dd>
          <dt>所属展区</dt><dd id="rZone"></dd>
        </dl>
      </div>
    </div>
  </main>

  <footer class="footer">展会通 EXPO PASS · 让每一次入场更高效</footer>
  <script src="/js/query.js"></script>
</body>
</html>
