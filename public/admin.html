<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 展会入场码查询系统</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="brand-mark">展</div>
        <div class="brand-text">
          <strong>入场码管理后台</strong>
          <span>ADMIN&nbsp;CONSOLE</span>
        </div>
      </div>
      <div class="topbar-side" id="topbarUser"></div>
    </div>
  </header>

  <!-- 登录视图 -->
  <div id="loginView" class="login-wrap hidden">
    <div class="card card-glow login-card">
      <h2>管理员登录</h2>
      <p class="sub">仅限授权工作人员使用，登录行为将被记录</p>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="loginUser">账号</label>
          <input type="text" id="loginUser" placeholder="请输入管理员账号" />
        </div>
        <div class="field">
          <label for="loginPass">密码</label>
          <input type="password" id="loginPass" placeholder="请输入密码" />
        </div>
        <div id="loginAlert"></div>
        <button type="submit" class="btn btn-primary" id="loginBtn">登 录</button>
      </form>
      <div class="notice-bar" style="margin-top:22px;">
        <a href="/">← 返回访客查询页</a>
      </div>
    </div>
  </div>

  <!-- 工作台 -->
  <div id="appView" class="hidden">
    <div class="admin-shell container" style="max-width:1280px;">
      <aside class="sidebar">
        <button class="nav-item active" data-page="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          数据概览
        </button>
        <button class="nav-item" data-page="tickets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><line x1="13" y1="8" x2="13" y2="16" stroke-dasharray="2 2"/></svg>
          票码管理
        </button>
        <button class="nav-item" data-page="logs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 4 21 10 15 10"/></svg>
          查询记录
        </button>
        <div class="nav-section" id="sysSection">系统管理</div>
        <button class="nav-item hidden" id="navAdmins" data-page="admins">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          管理员账号
        </button>
      </aside>

      <main class="admin-main" id="pageRoot"><!-- 页面由 JS 渲染 --></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toast-root"></div>

  <script src="/js/admin.js"></script>
</body>
</html>
